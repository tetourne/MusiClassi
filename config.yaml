# ============================================================================
# Config for run_ablation.py and run_permutation.py
# ============================================================================

paths:
  features_csv: /run/media/thomas/Data/Documents/Database/fma_metadata/myfeatures.csv
  tracks_csv:   /run/media/thomas/Data/Documents/Database/fma_metadata/tracks.csv
  output_dir:   /run/media/thomas/Data/Documents/Database/results            # results/<feature_set>/{ablation,permutation}/

data:
  subset: small                    # small | medium | large (cumulative)

# ----------------------------------------------------------------------------
# Feature sets: which columns the analysis starts from.
# Select with `feature_set:` below, or on the command line (--feature-set).
# A set is "all", or a list of selectors (union of the selectors).
# A selector = any of feature / statistics / number (name or list; all must
# match), plus an optional `exclude:` selector.
# ----------------------------------------------------------------------------
feature_set: full

feature_sets:
  full: all

  # EDIT ME: replace by the real content of your compact set.
  compact:
    - feature: [mfcc, chroma_cens, spectral_contrast, spectral_flatness,
                spectral_centroid, spectral_bandwidth, spectral_rolloff_85,
                rms, zcr, percussive_ratio, onset_strength]
      statistics: [mean, std, skew, kurtosis]
    - feature: [tempo, beat_rate]

  more_compact:
    - feature: [mfcc, spectral_contrast, spectral_flatness,
                spectral_centroid, spectral_bandwidth, spectral_rolloff_85,
                rms, zcr]
      statistics: [mean, std, skew, kurtosis]
    - feature: [tempo]

  # Example: everything except the 'min'/'max' statistics
  # no_extremes:
  #   - exclude: {statistics: [min, max]}

# ----------------------------------------------------------------------------
# Families: how features (level-0 names) are grouped into families.
# Edit freely; a feature absent from every family is just ignored at the
# family level (a warning is printed).
# ----------------------------------------------------------------------------
# strict_families: true  -> error if a feature of the CSV is in no family, or if a name
#   listed below is not in the CSV (typo guard). Features in no family would otherwise be
#   silently omitted from every family-level analysis. false -> warning only.
# A feature listed in two families is always an error.
strict_families: true

families:
  chroma:               [chroma_stft, chroma_cqt, chroma_cens, delta_chroma_stft, delta_chroma_cqt]
  tonnetz:              [tonnetz_cqt, tonnetz_cens]
  mfcc:                 [mfcc, delta_mfcc, delta2_mfcc]
  # delta:                [delta_mfcc, delta2_mfcc, delta_chroma_stft, delta_chroma_cqt]
  spectral_shape:       [spectral_centroid, spectral_bandwidth, spectral_contrast, spectral_flatness,
                        spectral_flux, spectral_rolloff_50, spectral_rolloff_85, spectral_rolloff_95]
  energy_dynamics:      [rms, zcr]
  harmonic_percussive:  [harmonic_rms, percussive_rms, harmonic_ratio, percussive_ratio]
  rhythm:               [onset_strength, tempogram_mean, beat_interval, tempo, beat_rate]

  
# ----------------------------------------------------------------------------
# Groups to analyse (default for both scripts; each of the `ablation:` /
# `permutation:` sections can override with its own `groups:` block).
#   For each level: all | [list of group names] | null (= skip the level)
#   feature            : one group per feature, e.g. 'mfcc' (all coeffs x all stats)
#   family             : groups defined in `families` above
#   statistic          : one group per statistic ('mean', 'std', ..., 'value')
#   feature_statistic  : e.g. 'mfcc/std'
#   column             : every single column, e.g. 'mfcc/mean/03'  (SLOW: ~1400 groups)
#   custom             : your own groups, name -> selector (or list of selectors)
# ----------------------------------------------------------------------------
groups:
  family: all
  feature: all
  statistic: all
  feature_statistic: null
  column: null
  custom: {}
  # custom:
  #   mfcc_low_coeffs:  {feature: [mfcc, delta_mfcc, delta2_mfcc], number: [1, 2, 3, 4, 5]}
  #   tails_only:       {statistics: [min, max, 10th, 90th]}
  #   scalars_tempo:    {feature: [tempo, beat_rate]}

# ----------------------------------------------------------------------------
# Model: any sklearn-compatible classifier (short name or full dotted path).
# Short names: RandomForestClassifier, ExtraTreesClassifier, HistGradientBoostingClassifier,
#   GradientBoostingClassifier, SVC, LogisticRegression, KNeighborsClassifier, MLPClassifier,
#   LinearDiscriminantAnalysis, XGBClassifier, LGBMClassifier
# `random_state` is set automatically from evaluation.seed when not given.
# Inner parallelism (n_jobs in params) multiplies with runtime.n_jobs: keep one of them at 1.
# ----------------------------------------------------------------------------
model:
  class: HistGradientBoostingClassifier
  params:
    early_stopping: False
    max_iter: 100
    min_samples_leaf: 10
    # validation_fraction: 0.1  # not used when early_stopping=False
    learning_rate: 0.1
    max_leaf_nodes: 31
    l2_regularization: 1
  preprocessing:
    imputer: median               # median | mean | most_frequent | none
    scaler: none                  # none | standard | robust | minmax | quantile

  # class: SVC
  # params:
  #   C: 1.3
  #   kernel: rbf
  #   gamma: 0.000537
  # preprocessing: {imputer: median, scaler: quantile}

  # class: MLPClassifier
  # params:
  #   max_iter: 1000
  #   early_stopping: False
  #   hidden_layer_sizes: [(64,32),]
  #   alpha: 10.
  # preprocessing: {imputer: median, scaler: standard}

  

# ----------------------------------------------------------------------------
# Evaluation
# ----------------------------------------------------------------------------
evaluation:
  scheme: cv                      # cv (repeated, recommended) | holdout (single split, no error bars)
  seed: 42
  metrics: [f1_macro]   # accuracy | balanced_accuracy | f1_macro | f1_weighted | neg_log_loss
  primary_metric: f1_macro        # used for sorting / plots / console

  cv:
    splits: [training, validation]   # official FMA splits pooled for CV ('test' left untouched)
    n_splits: 5
    n_repeats: 3
    group_by_artist: true            # keep each artist in a single fold (avoids leakage)

  holdout:
    train_splits: [training]
    eval_splits: [validation]

runtime:
  n_jobs: 4                       # ablation: over (variant, split); permutation: over folds

# ----------------------------------------------------------------------------
ablation:
  # --- 1) one at a time: drop = remove the group, keep = use only the group.
  #        modes: []  skips it (it is by far the most expensive: ~1400 fits for the groups above).
  modes: []
  # groups: {family: all, feature: [mfcc, rms]}   # optional override of the `groups` block

  # --- 2) named removals, reusable in `configurations` below.
  #        A removal = a selector (feature / statistics / number / family / exclude / columns_csv),
  #        or a list of selectors (their union).
  removals:
    hp:            {family: harmonic_percussive}
    beat_int:      {feature: beat_interval}
    tempo:         {feature: tempo}
    rms:           {feature: rms}
    beat_rate:     {feature: beat_rate}
    tempog_mean:   {feature: tempogram_mean}
    spec_flatness: {feature: spectral_flatness}
    c_cqt:         {feature: chroma_cqt}
    d_cqt:         {feature: delta_chroma_cqt}
    c_cens:        {feature: chroma_cens}
    t_cqt:         {feature: tonnetz_cqt}
    t_cens:        {feature: tonnetz_cens}

  # --- 3) configurations: each one is the FULL set minus its own list of removals, so a feature
  #        can be removed in one configuration and kept in another. The full set ("full") is
  #        always run automatically as the baseline. Items of `remove` are names from `removals`
  #        or inline selectors. Every configuration is compared with `full` and with every other.
  configurations:
    - {name: no_hp,                remove: [hp]}
    - {name: no_hp_t_cqt,          remove: [hp, t_cqt]}
    - {name: no_hp_t_cens,         remove: [hp, t_cens]}
    - {name: no_hp_t_cqt_t_cens,   remove: [hp, t_cqt, t_cens]}
    - {name: no_hp_rms,            remove: [hp, rms]}
    - {name: no_hp_beat_int,       remove: [hp, beat_int]}
    - {name: no_hp_tempo,          remove: [hp, tempo]}
    - {name: no_hp_beat_rate,      remove: [hp, beat_rate]}
    - {name: no_hp_beat_track,     remove: [hp, beat_rate, tempo, beat_int]}
    - {name: no_hp_tempog_mean,    remove: [hp, tempog_mean]}
    - {name: no_hp_spec_flatness,  remove: [hp, spec_flatness]}
    - {name: no_hp_cqt_based,      remove: [hp, c_cqt, d_cqt, c_cens, t_cqt, t_cens]}

  # --- 4) cumulative: successive removal, in this order (full, -A, -A-B, -A-B-C, ...).
  cumulative:
    # - {name: harmonic_percussive, remove: {family: harmonic_percussive}}
    # - {name: beat_interval,       remove: {feature: beat_interval}}
    # - {name: tempo,               remove: {feature: tempo}}
    # - {name: rms,                 remove: {feature: rms}}
    # - {name: tonnetz_cqt,         remove: {feature: tonnetz_cqt}}
    # - {name: tonnetz_cens,        remove: {feature: tonnetz_cens}}
    # - {name: beat_rate,           remove: {feature: beat_rate}}
    # - {name: tempogram_mean,      remove: {feature: tempogram_mean}}
    # - {name: spectral_flatness,   remove: {feature: spectral_flatness}}



permutation:
  n_repeats: 10                   # shuffles per group per fold
  # groups: {family: all, feature: all, column: all}   # optional override

output:
  plots: true
  top_n_plot: 40
  top_n_console: 15

# ----------------------------------------------------------------------------
# Correlation analysis (run_correlation.py). Uses the active feature_set,
# `families` above, and output.* options.
# ----------------------------------------------------------------------------
correlation:
  methods: [spearman, pearson]    # spearman is robust to the heavy tails of skew/kurtosis/min/max
  splits: [training, validation]  # tracks used; 'test' is left out so pruning decisions never see it
  pair_threshold: 0.9             # |r| above which pairs are listed in top_pairs*.csv
  max_pairs_saved: 100000
  thresholds: [0.5, 0.7, 0.8, 0.9, 0.95, 0.99]   # for pair counts and the redundancy curve
  per_statistic: [mean]           # statistics that get their own sub-matrix (add e.g. std, median)
  include_scalars: true           # tempo / beat_rate ('value') are added to each sub-matrix
  save_full_matrix: true          # corr_matrix.csv (~15 MB for 1400 columns)
  full_heatmap: true
  vif: true
  clustering:
    threshold: 0.9                # columns in a cluster have average |r| >= threshold
    representative: medoid        # medoid (label-free) | relevance (ANOVA F vs genre; uses labels!)
